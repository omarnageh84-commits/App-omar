<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>إدارة الصيدلية</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .page-frame {
            width: 100%;
            height: 80vh;
            border: none;
        }
    </style>
</head>

<body>

    <div class="app-container">

        <!-- ================= التبويبات الرئيسية ================= -->
        <div class="tabs-header">
            <button class="tab-btn active" onclick="openTab(event, 'pharmacyTab')">صيدلية 💊</button>
            <button class="tab-btn" onclick="openTab(event, 'privateTab')">الخاص 🔒</button>
        </div>

        <!-- ================= محتوى تبويب الصيدلية الرئيسي ================= -->
        <div id="pharmacyTab" class="tab-content active-content">

            <!-- شريط التبويبات الفرعية للصيدلية -->
            <div class="sub-tabs-header">
                <button class="sub-tab-btn active" onclick="openSubTab(event, 'pharmacySub1', 'pharmacy-group')">اليومية</button>
                <button class="sub-tab-btn" onclick="openSubTab(event, 'pharmacySub2', 'pharmacy-group')">المشتريات</button>
                <button class="sub-tab-btn" onclick="openSubTab(event, 'pharmacySub3', 'pharmacy-group')">الاجمالي</button>
                <button class="sub-tab-btn" onclick="openSubTab(event, 'pharmacySub4', 'pharmacy-group')">قواعد البيانات</button>
            </div>

            <!-- 1. تبويب اليومية -->
            <div id="pharmacySub1" class="sub-sub-content pharmacy-group active-sub">
                <iframe src="daily.html" class="page-frame"></iframe>
            </div>

            <!-- 2. تبويب المشتريات -->
            <div id="pharmacySub2" class="sub-sub-content pharmacy-group">
                <iframe src="purchases.html" class="page-frame"></iframe>
            </div>

            <!-- 3. تبويب الاجمالي -->
            <div id="pharmacySub3" class="sub-sub-content pharmacy-group">
                <iframe src="totals.html" class="page-frame"></iframe>
            </div>

            <!-- 4. تبويب قواعد البيانات (اللي كنت بتسأل عنه) -->
            <div id="pharmacySub4" class="sub-sub-content pharmacy-group">
                <iframe src="database.html" class="page-frame"></iframe>
            </div>

        </div>

        <!-- ================= محتوى التبويب الخاص الرئيسي ================= -->
        <div id="privateTab" class="tab-content">
            <div class="sub-tabs-header">
                <button class="sub-tab-btn active" onclick="openSubTab(event, 'privateSub1', 'private-group')">المصريف</button>
                <button class="sub-tab-btn" onclick="openSubTab(event, 'privateSub2', 'private-group')">الديون</button>
                <button class="sub-tab-btn" onclick="openSubTab(event, 'privateSub3', 'private-group')">الحضور والانصراف</button>
                <button class="sub-tab-btn" onclick="openSubTab(event, 'privateSub4', 'private-group')">ملاحظاتي</button>
            </div>

            <div id="privateSub1" class="sub-sub-content private-group active-sub">
                <h3>🔒 محتوى المصاريف</h3>
            </div>
            <div id="privateSub2" class="sub-sub-content private-group">
                <h3>🔒 محتوى الديون</h3>
            </div>
            <div id="privateSub3" class="sub-sub-content private-group">
                <h3>🔒 محتوى الحضور والانصراف</h3>
            </div>
            <div id="privateSub4" class="sub-sub-content private-group">
                <h3>🔒 محتوى ملاحظاتي</h3>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
