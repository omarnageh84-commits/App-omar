<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>إدارة عمر - النسخة الاحترافية</title><link rel="stylesheet" href="style.css"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet"></head>
<body>
<div class="app-container">
<div class="tabs-header">
<button class="tab-btn active" onclick="openTab(event,'pharmacyTab')">💊 الصيدلية</button>
<button class="tab-btn" onclick="openTab(event,'privateTab')">🔒 الخاص</button>
</div>

<div id="pharmacyTab" class="tab-content active-content">
<div class="sub-tabs-header">
<button class="sub-tab-btn active" onclick="openSubTab(event,'dailySection','pharmacy-group')">📅 اليومية</button>
<button class="sub-tab-btn" onclick="openSubTab(event,'purchasesSection','pharmacy-group')">📦 المشتريات</button>
<button class="sub-tab-btn" onclick="openSubTab(event,'totalsSection','pharmacy-group')">📊 الإجمالي</button>
<button class="sub-tab-btn" onclick="openSubTab(event,'databaseSection','pharmacy-group')">⚙️ قواعد البيانات</button>
</div>

<div id="dailySection" class="pharmacy-group">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px"><h3 style="margin:0">اليومية</h3><div style="display:flex;gap:8px;align-items:center"><input type="date" id="dailyMainDate" class="table-input" style="width:160px"><span id="dayNameDisplay" style="font-weight:800;color:var(--green)"></span></div></div>
<table class="pharmacy-table"><thead><tr><th>الموظف</th><th>القيمة</th><th>العجز/زيادة</th><th>المورد</th><th>القيمة</th><th>ملاحظات</th><th>حذف</th></tr></thead><tbody id="dailyTableBody"><tr><td><select class="table-input employee-dropdown"><option>اختر الموظف</option></select></td><td><input class="table-input" value="0"></td><td><input class="table-input deficit-col" value="0"></td><td><select class="table-input supplier-dropdown"><option>اختر المورد</option></select></td><td><input class="table-input" value="0"></td><td><input class="table-input"></td><td><button style="background:#fee2e2;color:#ef4444;border:none;padding:5px 8px;border-radius:6px" onclick="this.closest('tr').remove()">✕</button></td></tr></tbody></table>
<button onclick="addDailyRow()" style="margin-top:10px;background:var(--green);color:white;border:none;padding:8px 14px;border-radius:8px;font-weight:700">+ إضافة صف</button>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px"><div><table class="pharmacy-table"><thead><tr><th colspan="3">💳 فودافون كاش</th></tr><tr><th>سيستم</th><th>فعلي</th><th>الفرق</th></tr></thead><tbody id="vodafoneTableBody"><tr><td><input class="table-input calc-input" data-type="system" value="0"></td><td><input class="table-input calc-input" data-type="actual" value="0"></td><td><input class="table-input" data-type="diff" value="0" readonly></td></tr></tbody></table></div><div><table class="pharmacy-table"><thead><tr><th colspan="3">🏦 إنستا</th></tr><tr><th>سيستم</th><th>فعلي</th><th>الفرق</th></tr></thead><tbody id="instaTableBody"><tr><td><input class="table-input calc-input" data-type="system" value="0"></td><td><input class="table-input calc-input" data-type="actual" value="0"></td><td><input class="table-input" data-type="diff" value="0" readonly></td></tr></tbody></table></div></div>
<div style="margin-top:16px;display:flex;gap:10px"><button onclick="saveDaily()" style="flex:1;background:var(--green);color:white;border:none;padding:12px;border-radius:10px;font-weight:800">💾 حفظ اليوم</button><button onclick="resetDaily()" style="background:#fef2f2;color:#ef4444;border:1px solid #fecaca;padding:12px;border-radius:10px;font-weight:800">♻️ تهي
