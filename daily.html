<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><link rel="stylesheet" href="style.css"></head><body>
<h3>اليومية - <input type="date" id="dailyMainDate"> <span id="dayNameDisplay"></span></h3>
<table class="pharmacy-table"><thead><tr><th>الموظف</th><th>القيمة</th><th>العجز/زيادة</th><th>المورد</th><th>القيمة</th><th>ملاحظات</th><th>حذف</th></tr></thead><tbody id="dailyTableBody">
<tr><td><select class="table-input employee-dropdown"><option>اختر الموظف</option></select></td><td><input class="table-input" value="0"></td><td><input class="table-input deficit-col" value="0"></td><td><select class="table-input supplier-dropdown"><option>اختر المورد</option></select></td><td><input class="table-input" value="0"></td><td><input class="table-input"></td><td><button onclick="this.closest('tr').remove()">X</button></td></tr>
</tbody></table>
<button onclick="addDailyRow()">+ صف</button>
<div style="display:flex;gap:20px;margin-top:15px">
<table class="pharmacy-table"><thead><tr><th colspan="3">فودافون كاش</th></tr><tr><th>سيستم</th><th>فعلي</th><th>الفرق</th></tr></thead><tbody id="vodafoneTableBody"><tr><td><input class="table-input calc-input" data-type="system" value="0"></td><td><input class="table-input calc-input" data-type="actual" value="0"></td><td><input class="table-input" data-type="diff" value="0" readonly></td></tr></tbody></table>
<table class="pharmacy-table"><thead><tr><th colspan="3">إنستا</th></tr><tr><th>سيستم</th><th>فعلي</th><th>الفرق</th></tr></thead><tbody id="instaTableBody"><tr><td><input class="table-input calc-input" data-type="system" value="0"></td><td><input class="table-input calc-input" data-type="actual" value="0"></td><td><input class="table-input" data-type="diff" value="0" readonly></td></tr></tbody></table>
</div>
<div style="margin-top:15px"><button onclick="saveDaily()" style="background:#0e9f6e;color:white;padding:8px 16px">حفظ</button><button onclick="resetDaily()" style="background:#ef4444;color:white;padding:8px 16px">تهيئة</button></div>
<script src="script.js"></script></body></html>
